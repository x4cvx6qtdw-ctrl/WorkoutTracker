<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#000000">
<title>💪 Training</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 44px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
    --blue: #0A84FF;
    --orange: #FF9F0A;
    --green: #30D158;
    --red: #FF375F;
    --purple: #BF5AF2;
    --coral: #FF6B35;
    --gray: #636366;
    --bg: #000000;
    --card: rgba(255,255,255,0.07);
    --card-border: rgba(255,255,255,0.09);
    --text: #FFFFFF;
    --text-secondary: rgba(255,255,255,0.45);
    --text-tertiary: rgba(255,255,255,0.25);
    --separator: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  input { -webkit-appearance: none; -moz-appearance: textfield; }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  ::-webkit-scrollbar { display: none; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }

  #app { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; }

  /* ── Screens ── */
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  /* ── Tab Bar ── */
  #tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    padding-bottom: var(--safe-bottom);
    z-index: 200;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 8px 0; position: relative;
  }
  .tab-btn .tab-icon { font-size: 22px; line-height: 1; }
  .tab-btn .tab-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
    color: var(--text-tertiary); transition: color 0.2s;
  }
  .tab-btn.active .tab-label { color: var(--blue); }
  .tab-btn.active::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 36px; height: 2px; background: var(--blue); border-radius: 1px;
  }

  /* ── Home Screen ── */
  #home-header {
    padding: calc(var(--safe-top) + 12px) 20px 16px;
    position: sticky; top: 0; z-index: 100;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .header-eyebrow {
    font-size: 11px; font-weight: 600; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px;
  }
  .header-title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }

  /* ── Week Scroller ── */
  #week-scroller {
    display: flex; gap: 8px;
    padding: 0 20px 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .week-btn {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 16px;
    background: var(--card); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px;
    transition: transform 0.1s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
    border: 1px solid transparent;
  }
  .week-btn.selected {
    background: linear-gradient(135deg, #0A84FF, #0055CC);
    border-color: rgba(10,132,255,0.4);
  }
  .week-btn:active { transform: scale(0.92); }
  .week-btn .wk-label {
    font-size: 10px; font-weight: 600; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .week-btn.selected .wk-label { color: rgba(255,255,255,0.7); }
  .week-btn .wk-num {
    font-size: 18px; font-weight: 800; color: var(--text-secondary); line-height: 1;
  }
  .week-btn.selected .wk-num { color: #fff; }

  /* ── Workout Cards ── */
  #workout-list { padding: 0 16px; overflow-y: auto; flex: 1; padding-bottom: 90px; }
  .day-label {
    font-size: 11px; font-weight: 600; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
    padding-left: 4px;
  }
  .workout-card {
    background: var(--card);
    border-radius: 20px; padding: 18px 20px;
    margin-bottom: 12px;
    border: 1px solid var(--card-border);
    transition: transform 0.1s cubic-bezier(0.34,1.56,0.64,1), background 0.3s, border 0.3s;
    cursor: pointer; width: 100%; text-align: left;
  }
  .workout-card:active { transform: scale(0.97); }
  .workout-card.done { border-color: var(--done-color, rgba(10,132,255,0.4)); }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-left { display: flex; align-items: center; gap: 12px; }
  .card-emoji-wrap {
    width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .card-name { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .card-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .card-chevron { font-size: 20px; color: var(--text-tertiary); }
  .progress-bar-track {
    height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
  }
  .progress-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; width: 0%; }
  .progress-label { font-size: 11px; font-weight: 600; margin-top: 5px; }

  .rest-card {
    background: rgba(255,255,255,0.04); border-radius: 20px; padding: 20px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 14px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .rest-card .rest-emoji { font-size: 32px; }
  .rest-card .rest-name { font-size: 17px; font-weight: 600; color: var(--text-secondary); }
  .rest-card .rest-sub { font-size: 13px; color: var(--text-tertiary); }

  /* ── Workout Detail Screen ── */
  #detail-header {
    padding: calc(var(--safe-top) + 8px) 20px 16px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--separator);
  }
  .back-btn {
    display: flex; align-items: center; gap: 4px;
    font-size: 16px; font-weight: 500; margin-bottom: 14px;
    color: var(--blue);
  }
  .back-btn:active { opacity: 0.6; }
  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .detail-eyebrow {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; margin-bottom: 4px;
  }
  .detail-title { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .pct-badge {
    border-radius: 14px; padding: 8px 14px; text-align: center; flex-shrink: 0;
  }
  .pct-badge .pct-num { font-size: 20px; font-weight: 700; line-height: 1; }
  .pct-badge .pct-label { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
  .detail-progress-track {
    margin-top: 16px; height: 4px; background: rgba(255,255,255,0.1);
    border-radius: 2px; overflow: hidden;
  }
  .detail-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1); }

  #exercise-list { flex: 1; overflow-y: auto; padding: 20px 16px 90px; }
  .section-label {
    font-size: 12px; font-weight: 600; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 1.1px; margin-bottom: 12px;
  }

  /* ── Exercise Cards ── */
  .exercise-card {
    background: var(--card); border-radius: 16px; margin-bottom: 10px;
    overflow: hidden; border: 1px solid transparent;
    transition: border-color 0.3s;
  }
  .exercise-card.all-done { border-color: var(--ex-color, rgba(10,132,255,0.4)); }
  .exercise-header {
    padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; cursor: pointer; width: 100%; text-align: left;
  }
  .exercise-header:active { background: rgba(255,255,255,0.04); }
  .ex-info { flex: 1; }
  .ex-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .ex-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ex-reps { font-size: 12px; color: var(--text-secondary); }
  .ex-note { font-size: 11px; font-weight: 500; }
  .ex-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .ex-progress-pill {
    border-radius: 20px; padding: 3px 9px;
    font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.08); color: var(--text-tertiary);
    transition: all 0.3s;
  }
  .ex-progress-pill.done { color: var(--ex-color); }
  .ex-chevron {
    color: var(--text-tertiary); font-size: 16px;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    display: inline-block;
  }
  .exercise-card.open .ex-chevron { transform: rotate(90deg); }

  .set-rows { display: none; padding: 0 16px 14px; border-top: 1px solid var(--separator); }
  .exercise-card.open .set-rows { display: block; animation: slideIn 0.2s ease; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--separator);
  }
  .set-row:last-child { border-bottom: none; }
  .set-left { display: flex; align-items: center; gap: 10px; }
  .set-num {
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.1); color: var(--text-secondary);
    flex-shrink: 0;
  }
  .set-num.final { background: rgba(255,159,10,0.2); color: #FF9F0A; }
  .set-reps { font-size: 13px; color: var(--text-secondary); }
  .set-reps.final { color: #FF9F0A; font-weight: 600; }
  .failure-badge {
    font-size: 10px; background: rgba(255,159,10,0.2); color: #FF9F0A;
    border-radius: 4px; padding: 1px 5px; font-weight: 700; margin-left: 6px;
  }
  .weight-input-wrap { position: relative; width: 54px; flex-shrink: 0; }
  .weight-input {
    width: 100%; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 2px solid transparent;
    color: var(--text); font-size: 14px; font-weight: 600;
    text-align: center; font-family: inherit; outline: none;
    transition: all 0.2s;
  }
  .weight-input.final-input { background: rgba(255,159,10,0.13); color: #FF9F0A; }
  .weight-input:focus { border-color: var(--blue); background: rgba(10,132,255,0.12); color: #fff; }
  .weight-input.final-input:focus { border-color: #FF9F0A; }
  .weight-unit {
    position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: var(--text-tertiary); white-space: nowrap;
  }

  /* ── Weight Tracker Screen ── */
  #weight-screen { overflow-y: auto; padding-bottom: 90px; flex: 1; }
  .wt-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
  .stat-card {
    background: var(--card); border-radius: 14px; padding: 14px 16px;
    border: 1px solid var(--card-border);
  }
  .stat-label {
    font-size: 11px; color: var(--text-tertiary); text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 4px;
  }
  .stat-value { font-size: 20px; font-weight: 700; line-height: 1; }
  .wt-list { margin: 0 16px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .wt-row {
    display: flex; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--separator);
  }
  .wt-row:last-child { border-bottom: none; }
  .wt-row.current-week { background: rgba(10,132,255,0.08); }
  .wt-week-label {
    width: 38px; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); flex-shrink: 0;
  }
  .wt-row.current-week .wt-week-label { color: var(--blue); }
  .wt-now-tag { font-size: 9px; color: var(--blue); display: block; line-height: 1.2; }
  .wt-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; font-weight: 600;
    font-family: inherit; min-width: 0;
  }
  .wt-input::placeholder { color: var(--text-tertiary); }
  .wt-delta {
    font-size: 13px; font-weight: 600; min-width: 52px; text-align: right;
    flex-shrink: 0;
  }

  /* ── Animations ── */
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .pop-in { animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
</head>
<body>
<div id="app">

  <!-- ── HOME SCREEN ─────────────────────────── -->
  <div id="screen-home" class="screen active">
    <div id="home-header">
      <div class="header-eyebrow">12-Week Program</div>
      <div class="header-title">💪 Training</div>
    </div>
    <div id="week-scroller"></div>
    <div id="workout-list"></div>
  </div>

  <!-- ── DETAIL SCREEN ───────────────────────── -->
  <div id="screen-detail" class="screen">
    <div id="detail-header">
      <button class="back-btn" onclick="showHome()">‹ Back</button>
      <div class="detail-top">
        <div>
          <div class="detail-eyebrow" id="detail-eyebrow"></div>
          <div class="detail-title" id="detail-title"></div>
        </div>
        <div class="pct-badge" id="detail-pct-badge">
          <div class="pct-num" id="detail-pct">0%</div>
          <div class="pct-label">done</div>
        </div>
      </div>
      <div class="detail-progress-track">
        <div class="detail-progress-fill" id="detail-progress-fill"></div>
      </div>
    </div>
    <div id="exercise-list"></div>
  </div>

  <!-- ── WEIGHT SCREEN ───────────────────────── -->
  <div id="screen-weight" class="screen">
    <div id="home-header" style="position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(var(--safe-top) + 12px) 20px 16px;">
      <div class="header-eyebrow">12-Week Program</div>
      <div class="header-title">⚖️ Weight Log</div>
    </div>
    <div id="wt-stats" style="padding:16px 16px 0;"></div>
    <div class="wt-stats-grid" id="wt-stat-cards" style="display:none;"></div>
    <div style="padding:0 16px 12px;margin-top:8px;">
      <div class="section-label">Weekly Weigh-Ins</div>
    </div>
    <div class="wt-list" id="wt-list"></div>
    <div style="height:20px;"></div>
  </div>

  <!-- ── TAB BAR ─────────────────────────────── -->
  <div id="tab-bar">
    <button class="tab-btn active" id="tab-workouts" onclick="switchTab('workouts')">
      <span class="tab-icon">💪</span>
      <span class="tab-label">Workouts</span>
    </button>
    <button class="tab-btn" id="tab-weight" onclick="switchTab('weight')">
      <span class="tab-icon">⚖️</span>
      <span class="tab-label">Weight</span>
    </button>
  </div>

</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const WEEKS = 12;
const DAYS  = ['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','Day 7'];

const WORKOUTS = [
  { id:'back',      name:'Back & Biceps',       emoji:'🏋️', color:'#0A84FF', g:['#0A84FF','#0055CC'],

      {name:'Standing Calf Raise',        sets:7, reps:'12–15',        note:'35s rest'},

    ]},
  { id:'chest',     name:'Chest & Triceps',       emoji:'💪', color:'#30D158', g:['#30D158','#1A8A35'],
    exercises:[
      {name:'Abs',                        sets:3, reps:'Till Failure',  note:''},
      {name:'Cable Crossovers',           sets:3, reps:'12–15',        note:''},

    exercises:[
      {name:'Single Leg Curl',            sets:3, reps:'10–12',        note:''},
      {name:'Hyperextensions w/ Weight',  sets:3, reps:'12',           note:'Hold 3s at top'},
      {name:'Glute Kickback',             sets:3, reps:'15',           note:''},
      {name:'Barbell RDL',                sets:3, reps:'10–12',        note:''},

      {name:'Abs',                        sets:3, reps:'Till Failure',  note:'3x'},
    ]},
  { id:'shoulders', name:'Shoulders',              emoji:'🏔️', color:'#FF375F', g:['#FF375F','#CC1A3A'],
    exercises:[
      {name:'DB Lateral Raise',           sets:7, reps:'10',           note:'35s rest'},
      {name:'Seated DB Shoulder Press',   sets:3, reps:'10–12',        note:''},
      {name:'Abs',                        sets:3, reps:'Till Failure',  note:'3x'},
      {name:'Cable Lateral Raise',        sets:3, reps:'12–15',        note:''},
      {name:'Reverse Cable Fly',          sets:3, reps:'12–15',        note:''},
      {name:'Seated Machine Lateral',     sets:3, reps:'20',           note:''},
    ]},
  { id:'arms',      name:'Arms',                   emoji:'💥', color:'#FF6B35', g:['#FF6B35','#CC4A18'],
    exercises:[
      {name:'Abs',                        sets:3, reps:'Till Failure',  note:'3x'},
      {name:'Preacher EZ Bar / Machine Curl', sets:3, reps:'10–12',   note:''},
      {name:'Dumbbell Curl',              sets:3, reps:'10–12',        note:''},
      {name:'Reverse EZ Bar Curl',        sets:3, reps:'15',           note:''},
      {name:'Triceps Rope Pushdown',      sets:3, reps:'10–12',        note:''},
      {name:'Overhead Cable Extensions',  sets:3, reps:'15',           note:''},
      {name:'EZ Bar Skull Crushers',      sets:3, reps:'10–12',        note:''},
    ]},
];

// ── Storage ───────────────────────────────────────────────────────────────────
const LS_PREFIX = 'wt12_';
function lsGet(k)    { try { return localStorage.getItem(LS_PREFIX + k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(LS_PREFIX + k, v); } catch(e) {} }
function wKey(wid, ei, si, wk) { return `${wid}_${ei}_${si}_${wk}`; }
function bwKey(wk)              { return `bw_${wk}`; }

// ── State ─────────────────────────────────────────────────────────────────────
let selectedWeek   = 0;
let currentTab     = 'workouts';
let currentWorkout = null;

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildWeekScroller();
  buildWorkoutList();
  buildWeightTracker();
  updateWeightStats();
});

// ── Tab Switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('screen-home').classList.toggle('active', tab === 'workouts');
  document.getElementById('screen-weight').classList.toggle('active', tab === 'weight');
  document.getElementById('screen-detail').classList.remove('active');
  if (tab === 'weight') updateWeightStats();
}

// ── Week Scroller ─────────────────────────────────────────────────────────────
function buildWeekScroller() {
  const el = document.getElementById('week-scroller');
  el.innerHTML = '';
  for (let w = 0; w < WEEKS; w++) {
    const btn = document.createElement('button');
    btn.className = 'week-btn' + (w === selectedWeek ? ' selected' : '');
    btn.setAttribute('data-week', w);
    btn.innerHTML = `<span class="wk-label">Wk</span><span class="wk-num">${w+1}</span>`;
    btn.onclick = () => selectWeek(w);
    el.appendChild(btn);
  }
  // Scroll selected into view
  setTimeout(() => {
    const sel = el.querySelector('.selected');
    sel && sel.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }, 100);
}

function selectWeek(w) {
  selectedWeek = w;
  document.querySelectorAll('.week-btn').forEach((b, i) => {
    b.classList.toggle('selected', i === w);
  });
  buildWorkoutList();
  buildWeightTracker();
  updateWeightStats();
}

// ── Workout List ──────────────────────────────────────────────────────────────
function buildWorkoutList() {
  const el = document.getElementById('workout-list');
  el.innerHTML = '';
  WORKOUTS.forEach((wo, i) => {
    const dayEl = document.createElement('div');
    dayEl.className = 'day-label';
    dayEl.textContent = DAYS[i];
    el.appendChild(dayEl);

    if (wo.isRest) {
      const card = document.createElement('div');
      card.className = 'rest-card';
      card.innerHTML = `<div class="rest-emoji">😴</div>
        <div><div class="rest-name">Rest Day</div><div class="rest-sub">Recovery & growth</div></div>`;
      el.appendChild(card);
      return;
    }

    const { total, completed } = getProgress(wo, selectedWeek);
    const pct = total > 0 ? completed / total : 0;
    const done = pct === 1 && total > 0;

    const card = document.createElement('button');
    card.className = 'workout-card pop-in' + (done ? ' done' : '');
    card.style.setProperty('--done-color', wo.color + '50');
    card.style.animationDelay = (i * 0.04) + 's';
    if (done) {
      card.style.background = `linear-gradient(135deg, ${wo.g[0]}33, ${wo.g[1]}22)`;
    }
    card.innerHTML = `
      <div class="card-top">
        <div class="card-left">
          <div class="card-emoji-wrap" style="background:linear-gradient(135deg,${wo.g[0]},${wo.g[1]})">${wo.emoji}</div>
          <div>
            <div class="card-name">${wo.name}</div>
            <div class="card-meta">${wo.exercises.length} exercises · ${total} sets</div>
          </div>
        </div>
        <div class="card-chevron">›</div>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct*100}%;background:linear-gradient(90deg,${wo.g[0]},${wo.g[1]})"></div>
      </div>
      ${completed > 0 ? `<div class="progress-label" style="color:${wo.color}">${completed}/${total} sets logged</div>` : ''}
    `;
    card.onclick = () => showDetail(wo);
    el.appendChild(card);
  });
}

// ── Detail Screen ─────────────────────────────────────────────────────────────
function showDetail(wo) {
  currentWorkout = wo;
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');

  document.getElementById('detail-eyebrow').textContent = `Week ${selectedWeek + 1}`;
  document.getElementById('detail-eyebrow').style.color = wo.color;
  document.getElementById('detail-title').textContent = wo.emoji + ' ' + wo.name;

  const badge = document.getElementById('detail-pct-badge');
  badge.style.background = wo.color + '22';
  document.getElementById('detail-pct').style.color = wo.color;
  document.getElementById('detail-progress-fill').style.background =
    `linear-gradient(90deg,${wo.g[0]},${wo.g[1]})`;

  buildExerciseList(wo);
  updateDetailProgress(wo);
}

function showHome() {
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
  buildWorkoutList(); // refresh progress
}

function buildExerciseList(wo) {
  const el = document.getElementById('exercise-list');
  el.innerHTML = `<div class="section-label">${wo.exercises.length} Exercises · Final set to absolute failure</div>`;

  wo.exercises.forEach((ex, ei) => {
    const { completed: exDone } = getExProgress(wo.id, ei, ex.sets, selectedWeek);
    const allDone = exDone === ex.sets;
    const card = document.createElement('div');
    card.className = 'exercise-card' + (allDone ? ' all-done' : '');
    card.style.setProperty('--ex-color', wo.color);

    // Build set rows HTML
    let setRowsHtml = '';
    for (let si = 0; si < ex.sets; si++) {
      const isFinal = si === ex.sets - 1 && ex.sets > 1;
      const storedVal = lsGet(wKey(wo.id, ei, si, selectedWeek)) || '';
      setRowsHtml += `
        <div class="set-row">
          <div class="set-left">
            <div class="set-num${isFinal ? ' final' : ''}">${si+1}</div>
            <div class="set-reps${isFinal ? ' final' : ''}">
              ${ex.reps} reps
              ${isFinal ? '<span class="failure-badge">FAILURE</span>' : ''}
            </div>
          </div>
          <div class="weight-input-wrap">
            <input type="number" inputmode="decimal" class="weight-input${isFinal ? ' final-input' : ''}"
              placeholder="—"
              value="${storedVal}"
              data-key="${wKey(wo.id, ei, si, selectedWeek)}"
              data-wid="${wo.id}" data-ei="${ei}" data-si="${si}"
              onchange="saveWeight(this)"
              onblur="saveWeight(this)"
            >
            <div class="weight-unit">lbs</div>
          </div>
        </div>`;
    }

    card.innerHTML = `
      <button class="exercise-header" onclick="toggleExercise(this)">
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">
            <span class="ex-reps">${ex.sets} sets · ${ex.reps} reps</span>
            ${ex.note ? `<span class="ex-note" style="color:${wo.color};opacity:0.85">${ex.note}</span>` : ''}
          </div>
        </div>
        <div class="ex-right">
          <div class="ex-progress-pill${allDone ? ' done' : ''}" style="${allDone ? `color:${wo.color};background:${wo.color}22` : ''}">
            ${exDone}/${ex.sets}
          </div>
          <span class="ex-chevron">›</span>
        </div>
      </button>
      <div class="set-rows">${setRowsHtml}</div>
    `;
    el.appendChild(card);
  });
}

function toggleExercise(btn) {
  const card = btn.closest('.exercise-card');
  card.classList.toggle('open');
}

function saveWeight(input) {
  const key = input.getAttribute('data-key');
  lsSet(key, input.value);
  // Refresh progress displays
  if (currentWorkout) {
    updateDetailProgress(currentWorkout);
    refreshExerciseProgress(input);
  }
}

function refreshExerciseProgress(input) {
  const wo = currentWorkout;
  const ei = parseInt(input.getAttribute('data-ei'));
  const ex = wo.exercises[ei];
  const { completed } = getExProgress(wo.id, ei, ex.sets, selectedWeek);
  const allDone = completed === ex.sets;
  const card = input.closest('.exercise-card');
  card.classList.toggle('all-done', allDone);
  const pill = card.querySelector('.ex-progress-pill');
  pill.textContent = `${completed}/${ex.sets}`;
  if (allDone) {
    pill.classList.add('done');
    pill.style.color = wo.color;
    pill.style.background = wo.color + '22';
  } else {
    pill.classList.remove('done');
    pill.style.color = '';
    pill.style.background = '';
  }
}

function updateDetailProgress(wo) {
  const { total, completed } = getProgress(wo, selectedWeek);
  const pct = total > 0 ? Math.round(completed / total * 100) : 0;
  document.getElementById('detail-pct').textContent = pct + '%';
  document.getElementById('detail-progress-fill').style.width = pct + '%';
}

// ── Weight Tracker ────────────────────────────────────────────────────────────
function buildWeightTracker() {
  const el = document.getElementById('wt-list');
  el.innerHTML = '';
  for (let w = 0; w < WEEKS; w++) {
    const val   = lsGet(bwKey(w)) || '';
    const prevVal = w > 0 ? (lsGet(bwKey(w-1)) || '') : '';
    const isCur = w === selectedWeek;

    const row = document.createElement('div');
    row.className = 'wt-row' + (isCur ? ' current-week' : '');
    row.id = 'wt-row-' + w;

    const delta = (val && prevVal) ? (parseFloat(val) - parseFloat(prevVal)).toFixed(1) : '';
    const deltaColor = delta ? (parseFloat(delta) < 0 ? '#30D158' : parseFloat(delta) > 0 ? '#FF9F0A' : 'rgba(255,255,255,0.3)') : '';
    const deltaStr = delta ? ((parseFloat(delta) > 0 ? '+' : '') + delta) : '';

    row.innerHTML = `
      <div class="wt-week-label">
        W${w+1}
        ${isCur ? '<span class="wt-now-tag">now</span>' : ''}
      </div>
      <input type="number" inputmode="decimal" class="wt-input"
        placeholder="— lbs" value="${val}"
        data-week="${w}"
        onchange="saveBodyWeight(this)"
        onblur="saveBodyWeight(this)"
      >
      ${deltaStr ? `<div class="wt-delta" style="color:${deltaColor}">${deltaStr}</div>` : '<div class="wt-delta"></div>'}
    `;
    el.appendChild(row);
  }
}

function saveBodyWeight(input) {
  const w = parseInt(input.getAttribute('data-week'));
  lsSet(bwKey(w), input.value);
  buildWeightTracker(); // refresh deltas
  updateWeightStats();
}

function updateWeightStats() {
  const weights = Array.from({length: WEEKS}, (_, i) => {
    const v = lsGet(bwKey(i));
    return v ? parseFloat(v) : null;
  }).filter(v => v !== null);

  const statsEl  = document.getElementById('wt-stats');
  const cardsEl  = document.getElementById('wt-stat-cards');

  if (weights.length < 2) {
    statsEl.innerHTML = `<div class="section-label" style="padding-bottom:8px">Log 2+ weeks to see stats</div>`;
    cardsEl.style.display = 'none';
    return;
  }

  statsEl.innerHTML = `<div class="section-label" style="padding-bottom:8px">12-Week Summary</div>`;
  cardsEl.style.display = 'grid';

  const start = weights[0], end = weights[weights.length - 1];
  const diff  = (end - start).toFixed(1);
  const peak  = Math.max(...weights).toFixed(1);
  const low   = Math.min(...weights).toFixed(1);

  const stats = [
    { label:'Total Change', value: (diff > 0 ? '+' : '') + diff + ' lbs', color: diff < 0 ? '#30D158' : '#FF9F0A' },
    { label:'Entries',      value: `${weights.length}/12`,                  color: '#0A84FF' },
    { label:'Peak',         value: peak + ' lbs',                           color: '#FF375F' },
    { label:'Lowest',       value: low + ' lbs',                            color: '#BF5AF2' },
  ];

  cardsEl.innerHTML = stats.map(s => `
    <div class="stat-card" style="border-color:${s.color}30">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value" style="color:${s.color}">${s.value}</div>
    </div>
  `).join('');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function getProgress(wo, week) {
  if (!wo.exercises) return { total: 0, completed: 0 };
  let total = 0, completed = 0;
  wo.exercises.forEach((ex, ei) => {
    total += ex.sets;
    for (let si = 0; si < ex.sets; si++) {
      if (lsGet(wKey(wo.id, ei, si, week))) completed++;
    }
  });
  return { total, completed };
}

function getExProgress(wid, ei, sets, week) {
  let completed = 0;
  for (let si = 0; si < sets; si++) {
    if (lsGet(wKey(wid, ei, si, week))) completed++;
  }
  return { completed };
}
</script>
